name: Pull Request Merged

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re-)release, e.g. 1.0.0. Required for manual runs.'
        required: true
      force-retag:
        description: 'Delete and recreate the tag if it already exists'
        type: boolean
        default: false

jobs:

  resolve-work-items:
    if: github.event.pull_request.merged == true
    uses: tcfoss/github-actions/.github/workflows/resolve-pr-work-items.yml@v1
    permissions:
      contents: read
    with:
      pull-request-description: ${{ github.event.pull_request.body }}
      api-url: ${{ vars.ISSUETRACKER_API_URL }}
      target-status: Done
    secrets:
      issuetracker-api-token: ${{ secrets.ISSUETRACKER_API_TOKEN }}

  parse-version:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/') && github.base_ref == 'master')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        uses: tcfoss/github-actions/.github/actions/parse-release-version@v1
        with:
          branch: ${{ github.head_ref }}
          version-override: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

  tag:
    needs: parse-version
    uses: tcfoss/github-actions/.github/workflows/tag-release.yml@v1
    permissions:
      contents: write
    with:
      version: ${{ needs.parse-version.outputs.version }}
      force-retag: ${{ inputs.force-retag == true }}
    secrets:
      TAGGER_APP_CLIENT_ID: ${{ secrets.TAGGER_APP_CLIENT_ID }}
      TAGGER_APP_PRIVATE_KEY: ${{ secrets.TAGGER_APP_PRIVATE_KEY }}

  publish-app:
    needs: [parse-version, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.parse-version.outputs.version }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build and package CLI binaries
        run: |
          version="${{ needs.parse-version.outputs.version }}"
          for RID in linux-x64 win-x64 osx-arm64; do
            echo "Publishing CLI for RID: $RID..."
            dotnet publish src/TcfOss.DatabaseManager.App/TcfOss.DatabaseManager.App.csproj \
              --configuration Release \
              --runtime "$RID" \
              --self-contained false \
              --output "publish/dbman_$RID"

            echo "Creating tarball for RID: $RID..."
            (
              cd "publish/dbman_$RID"
              tar -czvf "../../database-manager-${RID}-${version}.tar.gz" *
            )
          done

      - name: Upload CLI binaries artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-binaries
          path: database-manager-*.tar.gz

  publish-dotnet:
    needs: [parse-version, tag]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.parse-version.outputs.version }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DatabaseManager.slnx

      - name: Build
        run: dotnet build DatabaseManager.slnx --no-restore --configuration Release

      - name: Pack
        run: |
          version="${{ needs.parse-version.outputs.version }}"
          projects=(
            "src/TcfOss.DatabaseManager.Core/TcfOss.DatabaseManager.Core.csproj"
            "src/TcfOss.DatabaseManager.MySql/TcfOss.DatabaseManager.MySql.csproj"
            "src/TcfOss.DatabaseManager.MariaDb/TcfOss.DatabaseManager.MariaDb.csproj"
            "src/TcfOss.DatabaseManager.MsSql/TcfOss.DatabaseManager.MsSql.csproj"
            "src/LibWrapper/TcfOss.DatabaseManager.Core.LibWrapper/TcfOss.DatabaseManager.Core.LibWrapper.csproj"
            "src/LibWrapper/TcfOss.DatabaseManager.MySql.LibWrapper/TcfOss.DatabaseManager.MySql.LibWrapper.csproj"
            "src/LibWrapper/TcfOss.DatabaseManager.MariaDb.LibWrapper/TcfOss.DatabaseManager.MariaDb.LibWrapper.csproj"
            "src/LibWrapper/TcfOss.DatabaseManager.MsSql.LibWrapper/TcfOss.DatabaseManager.MsSql.LibWrapper.csproj"
          )
          for proj in "${projects[@]}"; do
            echo "Packing $proj..."
            dotnet pack "$proj" \
              --no-build \
              --configuration Release \
              -p:PackageVersion="$version" \
              --output ./nupkg
            package_name="$(basename "$proj" .csproj)"
            if [[ ! -f "./nupkg/${package_name}.${version}.snupkg" ]]; then
              echo "::error::Missing symbol package for ${package_name} ${version}"
              exit 1
            fi
          done

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --no-symbols \
            --skip-duplicate

      - name: NuGet login (OIDC -> temp API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: tcflanagan

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --no-symbols \
            --skip-duplicate

      - name: Push symbols to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.snupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

  build-docs:
    name: Build Release Documentation
    needs: [parse-version, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/v${{ needs.parse-version.outputs.version }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build and validate documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-docs:
    name: Deploy Latest Release Documentation
    needs: [parse-version, build-docs, finalize-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Check release is the latest stable version
        id: latest
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: v${{ needs.parse-version.outputs.version }}
        with:
          script: |
            const { isLatestStableRelease } = require('./.github/scripts/docs-release.cjs');
            const releaseTag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo,
              per_page: 100
            });
            const deploy = isLatestStableRelease(releaseTag, releases);
            core.setOutput('deploy', String(deploy));
            if (!deploy) {
              core.info(`Skipping Pages deployment: ${releaseTag} is not the latest stable release.`);
            }

      - name: Configure GitHub Pages
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        if: steps.latest.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  finalize-release:
    needs: [parse-version, tag, publish-app, publish-dotnet, resolve-work-items]
    # resolve-work-items is skipped on workflow_dispatch
    if: >
      !cancelled() &&
      needs.publish-app.result == 'success' &&
      needs.publish-dotnet.result == 'success' &&
      (needs.resolve-work-items.result == 'success' || needs.resolve-work-items.result == 'skipped')
    uses: tcfoss/github-actions/.github/workflows/finalize-release.yml@v1
    permissions:
      contents: write
    with:
      version: ${{ needs.parse-version.outputs.version }}
      api-url: ${{ vars.ISSUETRACKER_API_URL }}
      release-status: Released
      work-item-status: Released
      artifact-name: cli-binaries
      files: database-manager-*.tar.gz
    secrets:
      issuetracker-api-token: ${{ secrets.ISSUETRACKER_API_TOKEN }}
