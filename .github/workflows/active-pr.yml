name: Active Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

jobs:

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build and validate documentation
        run: mkdocs build --strict

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test documentation release policy
        run: node --test .github/scripts/docs-release.test.cjs

  validate-work-items:
    if: github.event.sender.type != 'Bot'
    uses: tcfoss/github-actions/.github/workflows/validate-pr-work-items.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      pull-request-description: ${{ github.event.pull_request.body }}
      api-url: ${{ vars.ISSUETRACKER_API_URL }}
      target-status: Done
    secrets:
      issuetracker-api-token: ${{ secrets.ISSUETRACKER_API_TOKEN }}

  lint:
    name: Lint
    uses: tcfoss/github-actions/.github/workflows/dotnet-lint.yml@v1
    permissions:
      contents: read
    with:
      solution: DatabaseManager.slnx

  lint-dbman-dev:
    name: Lint dbman-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: tcfoss/github-actions/.github/actions/setup-poetry@v1
        with:
          working-directory: tools/dbman-dev
          install-args: --no-root

      - name: Lint dbman-dev (mypy)
        working-directory: tools/dbman-dev
        run: poetry run mypy ./src

  unit-tests:
    name: Unit Tests
    uses: tcfoss/github-actions/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
    with:
      solution: solutions/UnitTests.slnx
      project: solutions/UnitTests.slnx
      name: unit

  integration-tests:
    name: Integration Test (${{ matrix.name }})
    if: >
      startsWith(github.head_ref, 'release/') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            project: test/TcfOss.DatabaseManager.Core.IntegrationTests/TcfOss.DatabaseManager.Core.IntegrationTests.csproj
          - name: MySQL
            project: test/TcfOss.DatabaseManager.MySql.IntegrationTests/TcfOss.DatabaseManager.MySql.IntegrationTests.csproj
          - name: MariaDB
            project: test/TcfOss.DatabaseManager.MariaDb.IntegrationTests/TcfOss.DatabaseManager.MariaDb.IntegrationTests.csproj
          - name: MSSQL
            project: test/TcfOss.DatabaseManager.MsSql.IntegrationTests/TcfOss.DatabaseManager.MsSql.IntegrationTests.csproj
          - name: App
            project: test/TcfOss.DatabaseManager.App.IntegrationTests/TcfOss.DatabaseManager.App.IntegrationTests.csproj
    uses: tcfoss/github-actions/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
    with:
      solution: DatabaseManager.slnx
      project: ${{ matrix.project }}
      name: integration-${{ matrix.name }}
      integration: true

  today:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.today.outputs.date }}
    steps:
      - id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  validate-release:
    needs: [today, validate-work-items]
    if: startsWith(github.head_ref, 'release/')
    uses: tcfoss/github-actions/.github/workflows/validate-release.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      branch: ${{ github.head_ref }}
      api-url: ${{ vars.ISSUETRACKER_API_URL }}
      status: Released
      work-item-status: Released
      work-items-to-be-resolved: ${{ needs.validate-work-items.outputs.work-item-ids }}
      release-date: ${{ needs.today.outputs.date }}
    secrets:
      issuetracker-api-token: ${{ secrets.ISSUETRACKER_API_TOKEN }}

  coverage:
    needs: [unit-tests, integration-tests]
    if: >
      always() &&
      needs.unit-tests.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped')
    uses: tcfoss/github-actions/.github/workflows/coverage.yml@v1
    permissions:
      contents: read
      pull-requests: write
