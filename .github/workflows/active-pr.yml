name: Active Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

concurrency:
  group: active-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build and validate documentation
        run: mkdocs build --strict

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test documentation release policy
        run: node --test .github/scripts/docs-release.test.cjs

  validate-work-items:
    if: github.event.sender.type != 'Bot'
    uses: tcfoss/github-actions/.github/workflows/validate-pr-work-items.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      pull-request-description: ${{ github.event.pull_request.body }}
      api-url: ${{ vars.ISSUETRACKER_API_URL }}
      target-status: Done
    secrets:
      issuetracker-api-token: ${{ secrets.ISSUETRACKER_API_TOKEN }}

  lint:
    name: Lint
    uses: tcfoss/github-actions/.github/workflows/dotnet-lint.yml@v1
    permissions:
      contents: read
    with:
      solution: DatabaseManager.slnx

  lint-dbman-dev:
    name: Lint dbman-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: tcfoss/github-actions/.github/actions/setup-poetry@v1
        with:
          working-directory: tools/dbman-dev
          install-args: --no-root

      - name: Lint dbman-dev (mypy)
        working-directory: tools/dbman-dev
        run: poetry run mypy ./src

  unit-tests:
    name: Unit Tests
    if: >
      contains(github.event.pull_request.labels.*.name, 'unit-test-only')
    uses: tcfoss/github-actions/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
    with:
      solution: solutions/UnitTests.slnx
      project: solutions/UnitTests.slnx
      name: unit
      upload-coverage-filter-inputs: false

  all-tests:
    name: Full Test Suite
    if: >
      !contains(github.event.pull_request.labels.*.name, 'unit-test-only')
    uses: tcfoss/github-actions/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
    with:
      solution: DatabaseManager.slnx
      project: DatabaseManager.slnx
      name: full-suite
      integration: true
      upload-coverage-filter-inputs: true

  today:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.today.outputs.date }}
    steps:
      - id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  validate-release:
    needs: [today, validate-work-items]
    if: startsWith(github.head_ref, 'release/')
    uses: tcfoss/github-actions/.github/workflows/validate-release.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      branch: ${{ github.head_ref }}
      api-url: ${{ vars.ISSUETRACKER_API_URL }}
      status: Released
      work-item-status: Released
      work-items-to-be-resolved: ${{ needs.validate-work-items.outputs.work-item-ids }}
      release-date: ${{ needs.today.outputs.date }}
    secrets:
      issuetracker-api-token: ${{ secrets.ISSUETRACKER_API_TOKEN }}

  partial-coverage:
    needs: [unit-tests]
    if: >
      needs.unit-tests.result == 'success'
    uses: tcfoss/github-actions/.github/workflows/coverage.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      filter-unreachable-coverage: false
      upload-to-codecov: false
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      reportgenerator-license: ${{ secrets.REPORTGENERATOR_LICENSE }}
      unreachable-coverage-filter-token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    needs: [all-tests]
    if: >
      needs.all-tests.result == 'success'
    uses: tcfoss/github-actions/.github/workflows/coverage.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      filter-unreachable-coverage: true
      unreachable-coverage-regex: 'throw new (TcfOss\.)?(DatabaseManager\.)?(Core\.)?(Errors\.)?DefensiveGuardException\('
      upload-to-codecov: true
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      reportgenerator-license: ${{ secrets.REPORTGENERATOR_LICENSE }}
      unreachable-coverage-filter-token: ${{ secrets.GITHUB_TOKEN }}
