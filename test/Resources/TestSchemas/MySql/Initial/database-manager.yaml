Catalog: def
QuoteStyle: Backticks
Dialect: MariaDb

Schemas:
  - SchemaName: library_catalog
    RootPath: LibraryCatalog
  - SchemaName: library_identity
    RootPath: LibraryIdentity
  - SchemaName: library_activity
    RootPath: LibraryActivity

Credentials:
  HostName: localhost
  UserName: mariadb
  Password: mariadb
  Port: 3306

Formatting:
  PreferTabs: false
  TabSize: 4

  ObjectNamePrefixWithSchema: false
  SelectItemPrefixWithObject: true
  UpdateTargetPrefixWithObject: true
  OmitModifiersIfDefault: true
  OpeningParensOnNewLine: false
  JoinConditionIndent: 4
